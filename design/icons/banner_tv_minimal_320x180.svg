<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="320" height="180">
  <defs>
    <radialGradient id="tvBgCenter" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111626"/>
      <stop offset="40%" stop-color="#0A0D15"/>
      <stop offset="80%" stop-color="#05070B"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <radialGradient id="tvBlueAura" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.42"/>
      <stop offset="40%" stop-color="#0055FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tvBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#00A3FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vibrantElectric" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38EFFF"/>
      <stop offset="30%" stop-color="#00A6FF"/>
      <stop offset="70%" stop-color="#0055FF"/>
      <stop offset="100%" stop-color="#002699"/>
    </linearGradient>

    <linearGradient id="playInnerStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="tvPlayGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#0077FF" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="32" flood-color="#00F5FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#tvBgCenter)"/>
  <rect width="1920" height="1080" fill="url(#tvBlueAura)"/>

  <circle cx="960" cy="540" r="380" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1.5"/>
  <circle cx="960" cy="540" r="440" fill="none" stroke="#FFFFFF" stroke-opacity="0.015" stroke-width="1.5" stroke-dasharray="10 16"/>
  <ellipse cx="960" cy="540" rx="900" ry="3.5" fill="url(#tvBeam)"/>

  <!-- Centered Large Blue Play Triangle -->
  <g transform="translate(960, 540) scale(1.85) translate(-256, -256)">
    <g filter="url(#tvPlayGlow)">
      <path d="M 198 150
C 198 136, 213 128, 225 135
L 360 241
C 371 248, 371 264, 360 271
L 225 377
C 213 384, 198 376, 198 362
Z" fill="url(#vibrantElectric)"/>
      <path d="M 198 150
C 198 136, 213 128, 225 135
L 360 241
C 371 248, 371 264, 360 271
L 225 377
C 213 384, 198 376, 198 362
Z" fill="none" stroke="url(#playInnerStroke)" stroke-width="2.5"/>
    </g>
  </g>

  <rect width="1920" height="1080" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>