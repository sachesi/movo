name: Copr

# A release tag is built in the Copr project sachesi/software once its GitHub release is
# published (ci.yml calls this). Run by hand, it builds the given tag again.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v1.2.3
        required: true

permissions:
  contents: read

jobs:
  copr:
    name: Build in Copr
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Start the build
        env:
          # The custom webhook of sachesi/software, without the package name.
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: |
          [ -n "$COPR_WEBHOOK" ] || { echo "COPR_WEBHOOK is not set" >&2; exit 1; }
          # A draft's files cannot be downloaded, the crates the build needs among them.
          if ! curl -fsIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/movo-${TAG#v}-vendor.tar.xz"; then
            echo "::notice::The release of $TAG is not published yet; once it is, run this workflow for $TAG."
            exit 0
          fi
          # Copr's script for the package builds the tag it is sent, with the spec on main.
          curl -fsS -X POST --data "$TAG" "${COPR_WEBHOOK%/}/movo/"
