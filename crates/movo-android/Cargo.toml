[package]
name = "movo-android"
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
movo-core = { path = "../movo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["rt-multi-thread"] }
