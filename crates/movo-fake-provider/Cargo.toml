[package]
name = "movo-fake-provider"
version = "0.5.0"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Local stand-in for the streaming provider, for tests and headless runs"
publish = false

[lints]
workspace = true

[dependencies]
serde_json = "1.0"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
movo-core = { path = "../movo-core", features = ["test-provider"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time"] }

[lib]
name = "movo_fake_provider"
path = "src/lib.rs"

[[bin]]
name = "movo-fake-provider"
path = "src/main.rs"
